server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true

spring:
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          max-age: 0s
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: jarina-ui-client
            client-secret: ${KEYCLOAK_UI_CLIENT_SECRET:super-secret-bff-key-1234567890}
            authorization-grant-type: authorization_code
            redirect-uri: ${JARINA_UI_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope: openid, profile, email
          keycloak-internal:
            provider: keycloak
            client-id: jarina-internal-client
            client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:super-secret-internal-key-987654321}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.jarina:8085/realms/jarina}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.jarina:8085/realms/jarina}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.jarina:8085/realms/jarina}/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.jarina:8085/realms/jarina}/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.jarina:8085/realms/jarina}/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org:
      springframework:
        web: INFO

jarina:
  security:
    keycloak:
      # Keycloak realm "jarina" end_session_endpoint. Used for RP-initiated
      # logout so the "Switch user" button lands on the Keycloak login screen.
      end-session-uri: ${KEYCLOAK_END_SESSION_URI:${KEYCLOAK_ISSUER_URI:http://keycloak.jarina:8085/realms/jarina}/protocol/openid-connect/logout}
  client:
    rest:
      config:
        server:
          url: http://localhost:8080
      state:
        server:
          url: http://localhost:8082
      scheduler:
        server:
          url: http://localhost:8081
      task-proxy-for-spark:
        server:
          url: http://localhost:8099
    ui:
      health-check-timeout-ms: 3000
      services:
        - name: jarina-config-svc
          url: http://localhost:8080
          health-check-url: http://localhost:8080/healthz
        - name: jarina-scheduler-svc
          url: http://localhost:8081
          health-check-url: http://localhost:8081/healthz
        - name: jarina-state-svc
          url: http://localhost:8082
          health-check-url: http://localhost:8082/healthz
        - name: jarina-task-executor-svc-1
          url: http://localhost:8091
          health-check-url: http://localhost:8091/healthz
        - name: jarina-task-proxy-for-spark
          url: http://localhost:8099
          health-check-url: http://localhost:8099/healthz
        - name: postgres-db
          url: http://localhost:5432
          health-check-url: localhost:5432
          check-type: tcp
        - name: kafka-broker
          url: http://localhost:9092
          health-check-url: localhost:9092
          check-type: tcp
        - name: jarina-ui-modeller
          url: http://localhost:8093
          health-check-url: http://localhost:8093/healthz
        - name: git-server
          url: http://localhost:9418
          health-check-url: localhost:9418
          check-type: tcp
      vertices:
        config-svc: jarina-config-svc
        scheduler-svc: jarina-scheduler-svc
        state-svc: jarina-state-svc
        task-executor-1: jarina-task-executor-svc-1
        spark-proxy: jarina-task-proxy-for-spark
        postgres: postgres-db
        kafka: kafka-broker
        jarina-ui-modeller: jarina-ui-modeller
        git-server: git-server
      edges:
        config-svc:
          - state-svc
          - scheduler-svc
        scheduler-svc:
          - task-executor-1
        state-svc:
          - task-executor-1
        task-executor-1:
          - spark-proxy
        jarina-ui-modeller:
          - git-server

  # ------------------------------------------------------------------
  # Modelling (workspace storage, auth, session). Configuration domains
  # live under jarina.domains.* and are processed in jarina-domain-api.
  # Every runtime strategy is switched declaratively here and overridable
  # via JARINA_* environment variables.
  # ------------------------------------------------------------------
  modeller:
    storage:
      type: ${JARINA_WORKSPACE_STORAGE:local}          # [local, s3]
      root-directory: ${JARINA_WORKSPACE_ROOT:/tmp/jarina-workspaces}
      s3:                                                  # used when type == "s3"
        endpoint: ${JARINA_S3_ENDPOINT:}
        bucket: ${JARINA_S3_BUCKET:jarina-metadata-workspaces}
        access-key: ${JARINA_S3_ACCESS_KEY:}
        secret-key: ${JARINA_S3_SECRET_KEY:}
        region: ${JARINA_S3_REGION:us-east-1}
      cleanup-ttl-hours: ${JARINA_WORKSPACE_TTL_HOURS:4}  # lifetime of an inactive workspace

    auth-strategy: ${JARINA_AUTH_STRATEGY:jwt-rbac}    # [jwt-rbac, token-exchange]

    session:
      inactivity-minutes: ${JARINA_SESSION_INACTIVITY_MINUTES:30}

    logging:
      sync-log-capacity: ${JARINA_SYNC_LOG_CAPACITY:500}

  # Configuration domains (jarina.domains.<name>.git.*). A domain is active iff its
  # repository-url is set; credentials are declared per domain under git.credentials.
  # domains:
  #   platform:
  #     git:
  #       repository-url: git://git-server:9418/config-repo.git   # or ${DOMAIN_PLATFORM_URL:}
  #       branch: main
  #       credentials:
  #         auth-type: ssh
  #         ssh-private-key-path: /keys/platform_ed25519
  #   analytics:
  #     git:
  #       repository-url: ${DOMAIN_ANALYTICS_URL:}
  #       branch: ${DOMAIN_ANALYTICS_BRANCH:main}
  domains: {}

---
# Production profile: enforce HTTPS-only session cookie for the BFF
spring:
  config:
    activate:
      on-profile: prod
server:
  servlet:
    session:
      cookie:
        secure: true
