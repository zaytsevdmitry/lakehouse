kind: Task
name: sparkDQTemplate
template: sparkTemplate
taskProcessorBody: sparkTaskProcessorDQBody
description: Quality check
taskProcessorArgs:
  deploy.appResource: file:///opt/jarina-task-spark-apps/jarina-task-executor-spark-dq-app-0.12.0-jar-with-dependencies.jar
  deploy.mainClass: org.jarina.taskexecutor.spark.dq.SparkProcessorApplicationDQ
  jarina.taskexecutor.body.config.dq.kafka.producer.metric.status.topic: metric_status
  jarina.taskexecutor.body.config.dq.kafka.producer.metric.value.topic: metric_value
  jarina.taskexecutor.body.config.dq.kafka.producer.properties.bootstrap.servers: "broker:9092"
  jarina.taskexecutor.body.config.dq.kafka.producer.testSet.status.topic: metric_test_set_status
