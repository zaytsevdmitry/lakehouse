kind: Script
key: sql-template-postgres.uniqueKeyCheckIntegrity.sql
value: |
  select '{{ constraintName }}' as "subMetricName"
       , count(1) as "value"
       , '{{ constraintSeverity }}' as "severity"
  from (
    select {% for c in constraintColumns %}"{{ c }}"{% if not loop.last %}, {% endif %}{% endfor %}
    from {{ refCat(targetDataSetKeyName) }}
    group by {% for c in constraintColumns %}"{{ c }}"{% if not loop.last %}, {% endif %}{% endfor %}
    having count(1) > 1
  ) duplicate_keys
