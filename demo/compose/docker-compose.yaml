# Требования к хост-машине:
#   1. В /etc/hosts должна быть строка: 127.0.0.1 keycloak.lakehouse
#      (issuer Keycloak = http://keycloak.lakehouse:8085/realms/lakehouse и должен
#      разрешаться одинаково из контейнеров и из браузера хоста).
#   2. Админ-консоль Keycloak: http://keycloak.lakehouse:8085 (admin / admin_local_password);
#      при KC_HOSTNAME_STRICT=true доступ по localhost:8085 не работает.
#   3. lakehouse-config-svc (Swagger) опубликован на http://localhost:18081,
#      хост-порт 8080 занят lakehouse-ui-svc (redirect_uri в realm = localhost:8080),
#      18080 занят spark-history.
version: '3.9'
services:
  minio-dev:
    image: quay.io/minio/minio
    container_name: minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.30
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: spark_user
      MINIO_ROOT_PASSWORD: spark_pwd
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-dev:
    image: postgres:16-alpine
    container_name: db-dev
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgresUser
      POSTGRES_PASSWORD: postgresPW
      POSTGRES_DB: postgresDB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresUser -d postgresDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.10
    volumes:
      - ./conf_infra/security/init_keycloak_schema.sql:/docker-entrypoint-initdb.d/init_keycloak_schema.sql


  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-dev:5432/postgresDB?currentSchema=keycloak&ApplicationName=Keycloak
      KC_DB_USERNAME: postgresUser
      KC_DB_PASSWORD: postgresPW
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_local_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: keycloak.lakehouse
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_PORT: 8085
    ports:
      - "8085:8085"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.180
        aliases:
          - keycloak.lakehouse
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      db-dev:
        condition: service_healthy
    volumes:
      - ./conf_infra/security/realms/lakehouse-realm.json:/opt/keycloak/data/import/lakehouse-realm.json



  openbao:
    image: quay.io/openbao/openbao:2.0
    container_name: lakehouse-openbao
    ports:
      - "8200:8200"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.150
    environment:
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      BAO_DEV_ROOT_TOKEN_ID: "lakehouse-root-token"
      BAO_ADDR: "http://127.0.0.1:8200"
      BAO_TOKEN: "lakehouse-root-token"
    entrypoint: ["/bin/sh", "/opt/bao/init.sh"]
    volumes:
      - ./conf_infra/openbao/init.sh:/opt/bao/init.sh:ro
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 15s

  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.20
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://172.20.193.20:9092,CONTROLLER://172.20.193.20:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.20.193.20:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@172.20.193.20:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4

  # Lightweight git server hosting the declarative configuration repository
  # used by lakehouse-config-svc (CVS subsystem, git:// protocol).
  # On first start it imports ./conf_git (YAML mirror of ./conf) into branch main.
  git-server:
    image: alpine/git:latest
    build:
      context: ./conf_infra/git
      dockerfile: Dockerfile
    container_name: git-server
    user: root
    entrypoint: ["/bin/sh"]
    command: ["/srv/git-init.sh"]
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.200
    volumes:
      - ./conf_git:/conf:ro
      - git_server_storage:/srv/git
      - ./conf_infra/git/git-server-init.sh:/srv/git-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "git ls-remote git://127.0.0.1:9418/config-repo.git >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  hive-metastore:
    image: lakehouse-hms:0.9.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: hive-metastore
    restart: on-failure
    depends_on:
      db-dev:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      HIVE_METASTORE_WAREHOUSE_DIR: s3://data/warehouse
      DATABASE_TYPE: postgres
      HADOOP_CLASSPATH: "/opt/hive/lib/postgresql-42.7.3.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.1.0.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.271.jar"
    ports:
      - "9083:9083"
    volumes:
      - ./conf_infra/metastore-site.xml:/opt/hive/conf/hive-site.xml
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.60

  spark-master:
    image: lakehouse-spark-aws:0.9.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: spark-master
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_WEBUI_PORT: 8400
      SPARK_MASTER_HOSTNAME: 172.20.193.40
      SPARK_PUBLIC_DNS: 172.20.193.40
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_OPTS: "-Dspark.master.rest.enabled=true"
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      VAULT_TOKEN: lakehouse-spark-token
      S3_ENDPOINT: http://172.20.193.30:9000
      S3_TEST_URL: http://172.20.193.30:9001
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    ports:
      - "6066:6066"
      - "7077:7077"
      - "8400:8400"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.40
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g
    depends_on:
      minio-dev:
        condition: service_healthy
      db-dev:
        condition: service_healthy
      openbao:
        condition: service_healthy

  spark-worker-1:
    image: lakehouse-spark-aws:0.9.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: spark-worker-1
    environment:
      SPARK_MODE: worker
      SPARK_PUBLIC_DNS: 172.20.193.50
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_WORKER_WEBUI_PORT: 8401
      SPARK_MASTER_URL: spark://172.20.193.40:7077
      SPARK_WORKER_MEMORY: 6g
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_HOSTNAME: 172.20.193.50
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      VAULT_TOKEN: lakehouse-spark-token
      S3_ENDPOINT: http://172.20.193.30:9000
      S3_TEST_URL: http://172.20.193.30:9001
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    ports:
      - "8401:8401"
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.50
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf_infra/log4j2.properties:/opt/spark/conf/log4j2.properties
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    depends_on:
      spark-master:
        condition: service_started

  spark-history:
    image: lakehouse-spark-aws:0.9.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: spark-history
    environment:
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      S3_ENDPOINT: http://172.20.193.30:9000
      S3_TEST_URL: http://172.20.193.30:9001
      SPARK_MODE: history
      VAULT_TOKEN: lakehouse-spark-token
    ports:
      - "18080:18080"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.70
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  lakehouse-config-svc:
    image: lakehouse:0.9.0
    container_name: lakehouse-config-svc
    ports:
      - "18081:8080"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.80
#    environment:
#      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
#      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    environment:
      LAKEHOUSE_CONFIG_SCHEDULE_SEND_KAFKA_PRODUCER_PROPERTIES_BOOTSTRAP_SERVERS: "broker:9092"
      LAKEHOUSE_CONFIG_SCHEDULE_SEND_KAFKA_PRODUCER_PROPERTIES_CLIENT_ID: "lakehouse-config-service-client"
      LAKEHOUSE_CONFIG_GIT_REPOSITORY_URL: "git://git-server:9418/config-repo.git"
      LAKEHOUSE_CONFIG_GIT_BRANCH: "main"
      LAKEHOUSE_CONFIG_GIT_LOCAL_CLONE_PATH: "/tmp/config-repo"
      LAKEHOUSE_CONFIG_GIT_SYNC_ENABLED: "true"
      LAKEHOUSE_CONFIG_GIT_SYNC_INTERVAL_MS: "30000"
      LAKEHOUSE_CONFIG_GIT_SYNC_INITIAL_DELAY_MS: "10000"
      KEYCLOAK_ISSUER_URI: "http://keycloak.lakehouse:8085/realms/lakehouse"
      KEYCLOAK_INTERNAL_CLIENT_SECRET: "super-secret-internal-key-987654321"
    command: [
      "java",
      "-Dlogging.level.org.springframework.web.client.RestClient=DEBUG",
      "-Dlogging.level.org.apache.hc.client5.http=DEBUG",
      "-Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=ConfigSVC",
      "-Dlogging.level.org.springframework.boot.context.properties=DEBUG",
      "-jar", "/opt/lakehouse-config-svc-0.9.0-jar-with-dependencies.jar"
    ]
    depends_on:
      db-dev:
        condition: service_healthy
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      git-server:
        condition: service_healthy

  lakehouse-scheduler-svc:
    image: lakehouse:0.9.0
    container_name: lakehouse-scheduler-svc
    ports:
      - "8081:8081"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.90
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "java",
      "-Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=SchedulerSVC",
      "-Dlakehouse.scheduler.schedule.task.kafka.producer.properties.bootstrap.servers=broker:9092",
      "-Dlakehouse.scheduler.config.schedule.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-Dlakehouse.scheduler.registration.delay-ms=5000",
      "-Dlakehouse.scheduler.run.delay-ms=5000",
      "-Dlakehouse.scheduler.resolvedeps.delay-ms=5000",
      "-Dlakehouse.client.rest.config.server.url=http://lakehouse-config-svc:8080",
      "-jar", "/opt/lakehouse-scheduler-svc-0.9.0-jar-with-dependencies.jar"
      ]
    depends_on:
      db-dev:
        condition: service_healthy
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      lakehouse-config-svc:
        condition: service_started

  lakehouse-state-svc:
    image: lakehouse:0.9.0
    container_name: lakehouse-state-svc
    ports:
      - "8082:8082"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.100
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: >
      bash -c "java
      -Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=StateSVC
      -jar /opt/lakehouse-state-svc-0.9.0-jar-with-dependencies.jar"
    depends_on:
      db-dev:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  lakehouse-task-executor-svc-database:
    image: lakehouse:0.9.0
    container_name: task-executor-svc-database
    hostname: task-executor-svc-1
    ports:
      - "8091:8091"
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.110
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
      VAULT_TOKEN: lakehouse-spark-token
    command: [
      "java",
      "-Dserver.port=8091",
      "-Dlakehouse.client.rest.config.server.url=http://lakehouse-config-svc:8080",
      "-Dlakehouse.client.rest.scheduler.server.url=http://lakehouse-scheduler-svc:8081",
      "-Dlakehouse.client.rest.state.server.url=http://lakehouse-state-svc:8082",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.group.id=database",
      "-Dlakehouse.task-executor.service.id=database",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.concurrency=1",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-jar", "/opt/lakehouse-task-executor-svc-0.9.0-jar-with-dependencies.jar"
    ]
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      lakehouse-config-svc:
        condition: service_started
      lakehouse-scheduler-svc:
        condition: service_started
      lakehouse-state-svc:
        condition: service_started

  lakehouse-task-executor-svc-spark:
    image: lakehouse:0.9.0
    container_name: task-executor-svc-spark
    hostname: task-executor-svc-spark
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.130
    ports:
      - "8092:8092"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "java",
      "-Dserver.port=8092",
      "-Dlakehouse.client.rest.config.server.url=http://lakehouse-config-svc:8080",
      "-Dlakehouse.client.rest.scheduler.server.url=http://lakehouse-scheduler-svc:8081",
      "-Dlakehouse.client.rest.state.server.url=http://lakehouse-state-svc:8082",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.group.id=spark-cluster",
      "-Dlakehouse.task-executor.service.id=spark-exec-1",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.concurrency=1",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-jar", "/opt/lakehouse-task-executor-svc-0.9.0-jar-with-dependencies.jar"
    ]
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      lakehouse-config-svc:
        condition: service_started
      lakehouse-scheduler-svc:
        condition: service_started
      lakehouse-state-svc:
        condition: service_started

  lakehouse-task-executor-svc-state:
    image: lakehouse:0.9.0
    container_name: lakehouse-task-executor-svc-state
    hostname: lakehouse-task-executor-svc-state
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.140
    ports:
      - "8093:8093"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "java",
      "-Dserver.port=8093",
      "-Dlakehouse.client.rest.config.server.url=http://lakehouse-config-svc:8080",
      "-Dlakehouse.client.rest.scheduler.server.url=http://lakehouse-scheduler-svc:8081",
      "-Dlakehouse.client.rest.state.server.url=http://lakehouse-state-svc:8082",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.group.id=state-service",
      "-Dlakehouse.task-executor.service.id=state-service",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.concurrency=1",
      "-Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-jar", "/opt/lakehouse-task-executor-svc-0.9.0-jar-with-dependencies.jar"
    ]
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      lakehouse-config-svc:
        condition: service_started
      lakehouse-scheduler-svc:
        condition: service_started
      lakehouse-state-svc:
        condition: service_started

  trino:
    image: "trinodb/trino:478"
    ports:
      - "9090:9090"
    volumes:
      - ./conf_infra/trino/etc:/etc/trino
      - ./conf_infra/trino/catalog:/etc/trino/catalog
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.120
    depends_on:
      hive-metastore:
        condition: service_started
      minio-dev:
        condition: service_healthy
      broker:
        condition: service_started


  lakehouse-task-proxy4spark:
    image: lakehouse-task-proxy4spark:0.9.0
    container_name: lakehouse-task-proxy4spark
    hostname: lakehouse-task-task-proxy4spark
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.160
    ports:
      - "8099:8099"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "/opt/java/jdk-23.0.2/bin/java",
      "-Dlogging.level.org.springframework.web.client.RestClient=DEBUG",
      "-Dlogging.level.org.apache.hc.client5.http=DEBUG",
      "-Dserver.port=8099",
      "-Dlakehouse.task.proxy4spark.adapter=standalone",
      "-Dlakehouse.task.proxy4spark.spark-master=spark://spark-master:7077",
      "-Dlakehouse.task.proxy4spark.standalone.rest-url=http://spark-master:6066",
      "-Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=TaskProxy4Spark",
      "-jar", "/opt/lakehouse-task-spark-apps/lakehouse-task-proxy-for-spark-0.9.0-jar-with-dependencies.jar"
    ]
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      lakehouse-config-svc:
        condition: service_started
      lakehouse-scheduler-svc:
        condition: service_started
      lakehouse-state-svc:
        condition: service_started
      openbao:
        condition: service_healthy

  lakehouse-ui-svc:
    image: lakehouse:0.9.0
    container_name: lakehouse-ui-svc
    hostname: lakehouse-ui-svc
    networks:
      lakehouse_net:
        ipv4_address: 172.20.193.170
    ports:
      - "8080:8084" # хост-порт 8080: redirect_uri клиента lakehouse-ui-client в realm = localhost:8080
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.lakehouse:8085/realms/lakehouse
      KEYCLOAK_UI_CLIENT_SECRET: super-secret-bff-key-1234567890
    depends_on:
      keycloak:
        condition: service_healthy
      lakehouse-config-svc:
        condition: service_started
      lakehouse-scheduler-svc:
        condition: service_started
      lakehouse-state-svc:
        condition: service_started
      lakehouse-task-proxy4spark:
        condition: service_started
    command: [
      "java",
      "-Dlogging.level.org.springframework.web.client.RestClient=DEBUG",
      "-Dlogging.level.org.apache.hc.client5.http=DEBUG",
      "-Dlakehouse.ui.health-check-timeout-ms=3000",
      "-Dlakehouse.ui.services[0].name=lakehouse-config-svc",
      "-Dlakehouse.ui.services[0].url=http://172.20.193.80:8080",
      "-Dlakehouse.ui.services[0].health-check-url=http://172.20.193.80:8080/healthz",
      "-Dlakehouse.ui.services[1].name=lakehouse-scheduler-svc",
      "-Dlakehouse.ui.services[1].url=http://172.20.193.90:8081",
      "-Dlakehouse.ui.services[1].health-check-url=http://172.20.193.90:8081/healthz",
      "-Dlakehouse.ui.services[2].name=lakehouse-state-svc",
