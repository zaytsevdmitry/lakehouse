# Требования к хост-машине:
#   1. В /etc/hosts должна быть строка: 127.0.0.1 keycloak.jarina
#      (issuer Keycloak = http://keycloak.jarina:8085/realms/jarina и должен
#      разрешаться одинаково из контейнеров и из браузера хоста).
#   2. Админ-консоль Keycloak: http://keycloak.jarina:8085 (admin / admin_local_password);
#      при KC_HOSTNAME_STRICT=true доступ по localhost:8085 не работает.
#   3. jarina-config-svc (Swagger) опубликован на http://localhost:18081,
#      хост-порт 8080 занят jarina-ui-svc (redirect_uri в realm = localhost:8080),
#      порт 8081 занят jarina-ui-modeller-svc, 18080 занят spark-history.
version: '3.9'
services:
  minio-dev:
    image: bitnamilegacy/minio:2025.7.23
    container_name: minio-dev
    # The Bitnami image would run as uid 1001, but the named volume is created
    # root:root and the demo data in it is root-owned, so the server keeps
    # running as root, exactly as it did with the previous image
    user: root
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.30
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: spark_user
      MINIO_ROOT_PASSWORD: spark_pwd
    # Passed to the Bitnami entrypoint, which execs the binary as is. Without
    # `command` the entrypoint would start the server in the background, ignore
    # SIGTERM and leave the container to be killed after the stop timeout
    command: server --console-address ":9001" /data
    healthcheck:
      # The documented health endpoint, the same one the k8s probes use. The
      # `local` alias that `mc ready` relies on is only created by the Bitnami
      # entrypoint when it starts the server on its own, and it has no credentials
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-dev:
    image: postgres:16-alpine
    container_name: db-dev
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgresUser
      POSTGRES_PASSWORD: postgresPW
      POSTGRES_DB: postgresDB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresUser -d postgresDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      jarina_net:
        ipv4_address: 172.20.193.10
    volumes:
      - ./conf_infra/security/init_keycloak_schema.sql:/docker-entrypoint-initdb.d/init_keycloak_schema.sql


  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-dev:5432/postgresDB?currentSchema=keycloak&ApplicationName=Keycloak
      KC_DB_USERNAME: postgresUser
      KC_DB_PASSWORD: postgresPW
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_local_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: keycloak.jarina
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_PORT: 8085
    ports:
      - "8085:8085"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.180
        aliases:
          - keycloak.jarina
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      db-dev:
        condition: service_healthy
    volumes:
      - ./conf_infra/security/realms/jarina-realm.json:/opt/keycloak/data/import/jarina-realm.json

  openbao:
    image: quay.io/openbao/openbao:2.0
    ports:
      - "8200:8200"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.150
    environment:
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      BAO_DEV_ROOT_TOKEN_ID: "jarina-root-token"
      BAO_ADDR: "http://127.0.0.1:8200"
      BAO_TOKEN: "jarina-root-token"
    entrypoint: ["/bin/sh", "/opt/bao/init.sh"]
    volumes:
      - ./conf_infra/openbao/init.sh:/opt/bao/init.sh:ro
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 15s

  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.20
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://172.20.193.20:9092,CONTROLLER://172.20.193.20:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.20.193.20:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@172.20.193.20:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4

  # Lightweight git server hosting the declarative configuration repository
  # used by jarina-config-svc (CVS subsystem, git:// protocol).
  # On first start it imports ./conf_git (YAML mirror of ./conf) into branch main.
  git-server:
    image: jarina-git-server:1.0.0
    build:
      context: ./conf_infra/git
      dockerfile: Dockerfile
    container_name: git-server
    user: root
    entrypoint: ["/bin/sh"]
    command: ["/srv/git-init.sh"]
    networks:
      jarina_net:
        ipv4_address: 172.20.193.200
    volumes:
      - ../conf_git:/conf:ro
      - git_server_storage:/srv/git
      - ./conf_infra/git/git-server-init.sh:/srv/git-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "git ls-remote git://127.0.0.1:9418/platform.git >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  hive-metastore:
    image: jarina-hms:1.0.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: hive-metastore
    restart: on-failure
    depends_on:
      db-dev:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      HIVE_METASTORE_WAREHOUSE_DIR: s3://data/warehouse
      DATABASE_TYPE: postgres
      HADOOP_CLASSPATH: "/opt/hive/lib/postgresql-42.7.3.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.1.0.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.271.jar"
    ports:
      - "9083:9083"
    volumes:
      - ./conf_infra/metastore-site.xml:/opt/hive/conf/hive-site.xml
    networks:
      jarina_net:
        ipv4_address: 172.20.193.60

  spark-master:
    image: jarina-spark-aws:1.0.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: spark-master
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_WEBUI_PORT: 8400
      SPARK_MASTER_HOSTNAME: 172.20.193.40
      SPARK_PUBLIC_DNS: 172.20.193.40
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_OPTS: "-Dspark.master.rest.enabled=true"
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      VAULT_TOKEN: jarina-spark-token
      S3_ENDPOINT: http://172.20.193.30:9000
      S3_TEST_URL: http://172.20.193.30:9001
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    ports:
      - "6066:6066"
      - "7077:7077"
      - "8400:8400"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.40
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g
    depends_on:
      minio-dev:
        condition: service_healthy
      db-dev:
        condition: service_healthy
      openbao:
        condition: service_healthy

  spark-worker-1:
    image: jarina-spark-aws:1.0.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: spark-worker-1
    environment:
      SPARK_MODE: worker
      SPARK_PUBLIC_DNS: 172.20.193.50
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_WORKER_WEBUI_PORT: 8401
      SPARK_MASTER_URL: spark://172.20.193.40:7077
      SPARK_WORKER_MEMORY: 6g
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_HOSTNAME: 172.20.193.50
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      VAULT_TOKEN: jarina-spark-token
      S3_ENDPOINT: http://172.20.193.30:9000
      S3_TEST_URL: http://172.20.193.30:9001
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    ports:
      - "8401:8401"
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.50
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf_infra/log4j2.properties:/opt/spark/conf/log4j2.properties
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    depends_on:
      spark-master:
        condition: service_started

  spark-history:
    image: jarina-spark-aws:1.0.0
    entrypoint: ["/bin/sh", "-c", "/service.sh"]
    container_name: spark-history
    environment:
      AWS_ACCESS_KEY_ID: spark_user
      AWS_SECRET_ACCESS_KEY: spark_pwd
      S3_ENDPOINT: http://172.20.193.30:9000
      S3_TEST_URL: http://172.20.193.30:9001
      SPARK_MODE: history
      VAULT_TOKEN: jarina-spark-token
    ports:
      - "18080:18080"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.70
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  jarina-config-svc:
    image: jarina:1.0.0
    container_name: jarina-config-svc
    ports:
      - "8082:8082"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.80
    environment:
      JARINA_CONFIG_PRODUCE_KAFKA_PRODUCER_PROPERTIES_BOOTSTRAP_SERVERS: "broker:9092"
      KEYCLOAK_ISSUER_URI: "http://keycloak.jarina:8085/realms/jarina"
      KEYCLOAK_INTERNAL_CLIENT_SECRET: "super-secret-internal-key-987654321"
    command: [
      "java",
      "-Dlogging.level.org.springframework.web.client.RestClient=DEBUG",
      "-Dlogging.level.org.apache.hc.client5.http=DEBUG",
      "-Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=ConfigSVC",
      "-Dserver.port=8082",
      "-Dlogging.level.org.springframework.boot.context.properties=DEBUG",
      # Git Sync Settings
      "-Djarina.config.vcs.sync.enabled=true",
      "-Djarina.config.vcs.sync.interval-ms=30000",
      "-Djarina.config.vcs.sync.initial-delay-ms=10000",
      # Domain: platform
      "-Djarina.domains.platform.priority=0",
      "-Djarina.domains.platform.git.repository-url=git://git-server:9418/platform.git",
      "-Djarina.domains.platform.git.branch=main",
      "-Djarina.domains.platform.git.local-clone-path=/tmp/platform",
      # Domain: processing (included in to platform)
      "-Djarina.domains.platform.domains.processing.priority=0",
      "-Djarina.domains.platform.domains.processing.git.repository-url=git://git-server:9418/processing.git",
      "-Djarina.domains.platform.domains.processing.git.branch=main",
      "-Djarina.domains.platform.domains.processing.git.local-clone-path=/tmp/processing",
      # Domain: analytics (included in to processing)
      "-Djarina.domains.platform.domains.processing.domains.analytics.priority=0",
      "-Djarina.domains.platform.domains.processing.domains.analytics.git.repository-url=git://git-server:9418/analytics.git",
      "-Djarina.domains.platform.domains.processing.domains.analytics.git.branch=main",
      "-Djarina.domains.platform.domains.processing.domains.analytics.git.local-clone-path=/tmp/analytics",
      "-jar", "/opt/jarina-config-svc-1.0.0-jar-with-dependencies.jar"
    ]
    depends_on:
      db-dev:
        condition: service_healthy
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      git-server:
        condition: service_healthy

  jarina-scheduler-svc:
    image: jarina:1.0.0
    container_name: jarina-scheduler-svc
    ports:
      - "8083:8083"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.90
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "java",
      "-Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=SchedulerSVC",
      "-Djarina.scheduler.schedule.task.kafka.producer.properties.bootstrap.servers=broker:9092",
      "-Djarina.scheduler.config.change.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-Djarina.scheduler.registration.delay-ms=5000",
      "-Djarina.scheduler.run.delay-ms=5000",
      "-Djarina.scheduler.resolvedeps.delay-ms=5000",
      "-Dserver.port=8083",
      "-Djarina.client.rest.config.server.url=http://jarina-config-svc:8082",
      "-jar", "/opt/jarina-scheduler-svc-1.0.0-jar-with-dependencies.jar"
      ]
    depends_on:
      db-dev:
        condition: service_healthy
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      jarina-config-svc:
        condition: service_started

  jarina-state-svc:
    image: jarina:1.0.0
    container_name: jarina-state-svc
    ports:
      - "8084:8084"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.100
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: >
      bash -c "java
      -Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=StateSVC
      -Dserver.port=8084
      -jar /opt/jarina-state-svc-1.0.0-jar-with-dependencies.jar"
    depends_on:
      db-dev:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  jarina-task-executor-svc-database:
    image: jarina:1.0.0
    container_name: task-executor-svc-database
    ports:
      - "8090:8090"
    networks:
      jarina_net:
        ipv4_address: 172.20.193.110
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
      VAULT_TOKEN: jarina-spark-token
    command: [
      "java",
      "-Dserver.port=8090",
      "-Djarina.client.rest.config.server.url=http://jarina-config-svc:8082",
      "-Djarina.client.rest.scheduler.server.url=http://jarina-scheduler-svc:8083",
      "-Djarina.client.rest.state.server.url=http://jarina-state-svc:8084",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.properties.group.id=database",
      "-Djarina.task-executor.service.id=database",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.concurrency=1",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-jar", "/opt/jarina-task-executor-svc-1.0.0-jar-with-dependencies.jar"
    ]
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      jarina-config-svc:
        condition: service_started
      jarina-scheduler-svc:
        condition: service_started
      jarina-state-svc:
        condition: service_started

  jarina-task-executor-svc-spark:
    image: jarina:1.0.0
    container_name: task-executor-svc-spark
    networks:
      jarina_net:
        ipv4_address: 172.20.193.130
    ports:
      - "8092:8092"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "java",
      "-Dserver.port=8092",
      "-Djarina.client.rest.config.server.url=http://jarina-config-svc:8082",
      "-Djarina.client.rest.scheduler.server.url=http://jarina-scheduler-svc:8083",
      "-Djarina.client.rest.state.server.url=http://jarina-state-svc:8084",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.properties.group.id=spark-cluster",
      "-Djarina.task-executor.service.id=spark-exec-1",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.concurrency=1",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-jar", "/opt/jarina-task-executor-svc-1.0.0-jar-with-dependencies.jar"
    ]
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      jarina-config-svc:
        condition: service_started
      jarina-scheduler-svc:
        condition: service_started
      jarina-state-svc:
        condition: service_started

  jarina-task-executor-svc-state:
    image: jarina:1.0.0
    networks:
      jarina_net:
        ipv4_address: 172.20.193.140
    ports:
      - "8093:8093"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "java",
      "-Dserver.port=8093",
      "-Djarina.client.rest.config.server.url=http://jarina-config-svc:8082",
      "-Djarina.client.rest.scheduler.server.url=http://jarina-scheduler-svc:8083",
      "-Djarina.client.rest.state.server.url=http://jarina-state-svc:8084",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.properties.group.id=state-service",
      "-Djarina.task-executor.service.id=state-service",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.concurrency=1",
      "-Djarina.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers=broker:9092",
      "-jar", "/opt/jarina-task-executor-svc-1.0.0-jar-with-dependencies.jar"
    ]
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      jarina-config-svc:
        condition: service_started
      jarina-scheduler-svc:
        condition: service_started
      jarina-state-svc:
        condition: service_started

  trino:
    image: "trinodb/trino:478"
    ports:
      - "9090:9090"
    volumes:
      - ./conf_infra/trino/etc:/etc/trino
      - ./conf_infra/trino/catalog:/etc/trino/catalog
    networks:
      jarina_net:
        ipv4_address: 172.20.193.120
    depends_on:
      hive-metastore:
        condition: service_started
      minio-dev:
        condition: service_healthy
      broker:
        condition: service_started


  jarina-task-proxy4spark:
    image: jarina-spark-aws:1.0.0
    networks:
      jarina_net:
        ipv4_address: 172.20.193.160
    ports:
      - "8086:8086"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_INTERNAL_CLIENT_SECRET: super-secret-internal-key-987654321
    command: [
      "/opt/java/jdk-23.0.2/bin/java",
      "-Dlogging.level.org.springframework.web.client.RestClient=DEBUG",
      "-Dlogging.level.org.apache.hc.client5.http=DEBUG",
      "-Dserver.port=8086",
      "-Djarina.task.proxy4spark.adapter=standalone",
      "-Djarina.task.proxy4spark.spark-master=spark://spark-master:7077",
      "-Djarina.task.proxy4spark.standalone.rest-url=http://spark-master:6066",
      "-Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=TaskProxy4Spark",
      "-jar", "/opt/jarina-task-spark-apps/jarina-task-proxy-for-spark-1.0.0-jar-with-dependencies.jar"
    ]
    volumes:
      - ./conf_infra/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      broker:
        condition: service_started
      keycloak:
        condition: service_healthy
      jarina-config-svc:
        condition: service_started
      jarina-scheduler-svc:
        condition: service_started
      jarina-state-svc:
        condition: service_started
      openbao:
        condition: service_healthy

  jarina-ui-svc:
    image: jarina:1.0.0
    container_name: jarina-ui-svc
    hostname: jarina-ui-svc
    networks:
      jarina_net:
        ipv4_address: 172.20.193.170
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak.jarina:8085/realms/jarina
      KEYCLOAK_UI_CLIENT_SECRET: super-secret-bff-key-1234567890
      JARINA_GIT_URL: git://git-server:9418/platform.git
      JARINA_GIT_BRANCH: main
      JARINA_VCS_AUTH_TYPE: token
      JARINA_VCS_USER: modeller-bot
      JARINA_VCS_TOKEN: dummy
    depends_on:
      keycloak:
        condition: service_healthy
      git-server:
        condition: service_healthy
      jarina-config-svc:
        condition: service_started
      jarina-scheduler-svc:
