# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
# spark.master                     spark://master:7077
# spark.eventLog.enabled           true
# spark.eventLog.dir               hdfs://namenode:8021/directory
# spark.serializer                 org.apache.spark.serializer.KryoSerializer
# spark.driver.memory              5g
# spark.executor.extraJavaOptions  -XX:+PrintGCDetails -Dkey=value -Dnumbers="one two three"


# Licensed to the Apache Software Foundation (ASF) under one or more
# contributor license agreements.  See the NOTICE file distributed with
# this work for additional information regarding copyright ownership.

# ==========================================
# 1. Event Logging and Spark History Server
# ==========================================
spark.eventLog.enabled                 true
spark.eventLog.dir                     s3a://sparklogs/eventlog/
spark.history.fs.logDirectory          s3a://sparklogs/eventlog/
spark.history.ui.port                  18080

# ==========================================
# 2. S3 / MinIO Settings
# ==========================================
spark.hadoop.fs.s3a.impl               org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint           http://minio-dev:9000
spark.hadoop.fs.s3a.path.style.access  true
spark.hadoop.fs.s3a.access.key         spark_user  #todo move to secrets
spark.hadoop.fs.s3a.secret.key         spark_pwd   #todo move to secrets
spark.hive.s3.endpoint                 http://minio-dev:9000

# ==========================================
# 3. Instance Resources
# ==========================================
spark.driver.cores                     1
spark.executor.cores                   1
spark.executor.instances               1

# ==========================================
# 4. Combined JVM and Logging Options
# ==========================================
spark.driver.extraJavaOptions   -Dlog4j2.configurationFile=file:///opt/spark/conf/log4j2.properties --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.sql=ALL-UNNAMED --add-opens=java.sql/java.sql=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=jdk.unsupported/sun.misc=ALL-UNNAMED -Djdk.reflect.useDirectMethodHandle=false -XX:+IgnoreUnrecognizedVMOptions

spark.executor.extraJavaOptions -Dlog4j2.configurationFile=file:///opt/spark/conf/log4j2.properties --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.sql=ALL-UNNAMED --add-opens=java.sql/java.sql=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=jdk.unsupported/sun.misc=ALL-UNNAMED -Djdk.reflect.useDirectMethodHandle=false -XX:+IgnoreUnrecognizedVMOptions

# ==========================================
# 5. Catalogs: Iceberg & Hive
# ==========================================
spark.sql.catalogImplementation        hive
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehousestorage     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehousestorage.type       hive
spark.sql.catalog.lakehousestorage.uri        thrift://hive-metastore:9083
spark.sql.catalog.spark_catalog.warehouse s3a://data/warehouse/

# ==========================================
# 6. Catalogs: RDBMS (PostgreSQL JDBC)
# ==========================================
spark.sql.catalog.processingdb          org.apache.spark.sql.execution.datasources.v2.jdbc.JDBCTableCatalog
# Replace the placeholder below with your actual database URL
spark.sql.catalog.processingdb.url       jdbc:postgresql://<HOST>:<PORT>/<DATABASE_NAME>
spark.sql.catalog.processingdb.user      postgresUser #todo move to secrets
spark.sql.catalog.processingdb.password  postgresPW   #todo move to secrets
