# Prometheus configuration of the demo stand (demo/compose).
#
# Scrapes:
#   * yarina-task-proxy4spark — the Spring Boot Actuator endpoint with the proxy's
#     own metrics (yarina_task_proxy4spark_*) and the standard Spring/JVM metrics.
#     Inside the compose network the proxy listens on 8086 (server.port).
#   * Prometheus itself (self-monitoring).
#
# The SecurityMetrics of the Spark driver/executor JVMs (yarina credential providers:
# cache_hits_total, vault_auth_total, ...) are exported separately through the
# Prometheus JMX exporter javaagent — see the yarina-credential-providers-spark README,
# section "Setting up metrics export to Prometheus". Enable the two jobs below after
# attaching the javaagent via spark.driver.extraJavaOptions / spark.executor.extraJavaOptions.
# The proxy submits in cluster deploy mode, so on this stand (one worker) both the
# driver and the executors run in the spark-worker-1 container; give every JVM of the
# same kind its own port if there can be more than one per node.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: yarina-task-proxy4spark
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['yarina-task-proxy4spark:8086']

  # Enable after the JMX exporter javaagent is attached to the Spark JVMs
  # (yarina-credential-providers-spark README, "Setting up metrics export
  # to Prometheus"): the SecurityMetrics of the jobs appear as
  # yarina_security_counters_total{metric="<metric id>"}.
  # - job_name: spark-security-driver
