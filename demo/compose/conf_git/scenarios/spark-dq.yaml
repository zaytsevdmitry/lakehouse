kind: ScenarioActTemplate
keyName: spark-dq
description: Spark job scenario
tasks:
  - name: check
    taskExecutionServiceGroupName: state-service
    taskProcessor: dependencyCheckStateTaskProcessor
    importance: critical
    description: Dependency check
  - name: begin
    taskExecutionServiceGroupName: state-service
    taskProcessor: lockedStateTaskProcessor
    importance: critical
    description: Made interval status LOCKED
  - name: prepare
    taskExecutionServiceGroupName: spark-cluster
    taskProcessor: sparkStandAloneClusterTaskProcessor
    taskProcessorBody: createTableSQLProcessorBody
    importance: critical
    description: load from remote datastore
    driverKeyName: spark_iceberg
    taskProcessorArgs:
      deploy.appResource: "/opt/lakehouse-task-spark-apps/lakehouse-task-executor-spark-dataset-app-0.10.0-jar-with-dependencies.jar"
      deploy.clusterUrl: "http://172.20.193.160:8099/v1/submissions"
      deploy.mainClass: org.lakehouse.taskexecutor.spark.dataset.SparkProcessorApplication
      spark.app.name: "{{ getTaskFullName() }}"
      spark.driver.cores: "1"
      spark.driver.memory: "1g"
      spark.executor.cores: "1"
      spark.executor.memory: "1g"
      spark.ui.enabled: "true"
  - name: load
    taskExecutionServiceGroupName: spark-cluster
    taskProcessor: sparkStandAloneClusterTaskProcessor
    taskProcessorBody: mergeSQLProcessorBody
    importance: critical
    description: load from remote datastore
    driverKeyName: spark_iceberg
    taskProcessorArgs:
      deploy.clusterUrl: "http://172.20.193.160:8099/v1/submissions"
      deploy.appResource: "/opt/lakehouse-task-spark-apps/lakehouse-task-executor-spark-dataset-app-0.10.0-jar-with-dependencies.jar"
      deploy.mainClass: org.lakehouse.taskexecutor.spark.dataset.SparkProcessorApplication
      spark.app.name: "{{ getTaskFullName() }}"
      spark.driver.cores: "1"
      spark.driver.memory: "1g"
      spark.executor.cores: "1"
      spark.executor.memory: "1g"
      spark.ui.enabled: "true"
  - name: quality
    taskExecutionServiceGroupName: spark-cluster
    taskProcessor: sparkStandAloneClusterTaskProcessor
    taskProcessorBody: sparkTaskProcessorDQBody
    importance: critical
    description: load from remote datastore
    driverKeyName: spark_iceberg
    taskProcessorArgs:
      deploy.clusterUrl: "http://172.20.193.160:8099/v1/submissions"
      deploy.appResource: "/opt/lakehouse-task-spark-apps/lakehouse-task-executor-spark-dq-app-0.10.0-jar-with-dependencies.jar"
      deploy.mainClass: org.lakehouse.taskexecutor.spark.dq.SparkProcessorApplicationDQ
      lakehouse.taskexecutor.body.config.dq.kafka.producer.metric.status.topic: metric_status
      lakehouse.taskexecutor.body.config.dq.kafka.producer.metric.value.topic: metric_value
      lakehouse.taskexecutor.body.config.dq.kafka.producer.properties.bootstrap.servers: "broker:9092"
      lakehouse.taskexecutor.body.config.dq.kafka.producer.testSet.status.topic: metric_test_set_status
      spark.driver.cores: "1"
      spark.driver.memory: "1g"
      spark.app.name: "{{ getTaskFullName() }}"
      spark.executor.cores: "1"
      spark.executor.memory: "1g"
      spark.ui.enabled: "true"
  - name: compact
    taskExecutionServiceGroupName: spark-cluster
    taskProcessor: sparkStandAloneClusterTaskProcessor
    taskProcessorBody: compactTableSQLProcessorBody
    importance: critical
    description: load from remote datastore
    driverKeyName: spark_iceberg
    taskProcessorArgs:
      spark.ui.enabled: "true"
      spark.executor.cores: "1"
      spark.driver.cores: "1"
      spark.executor.memory: "1g"
      spark.app.name: "{{ getTaskFullName() }}"
      spark.driver.memory: "1g"
      deploy.clusterUrl: "http://172.20.193.160:8099/v1/submissions"
      deploy.mainClass: org.lakehouse.taskexecutor.spark.dataset.SparkProcessorApplication
      deploy.appResource: "/opt/lakehouse-task-spark-apps/lakehouse-task-executor-spark-dataset-app-0.10.0-jar-with-dependencies.jar"
  - name: finally
    taskExecutionServiceGroupName: state-service
    taskProcessor: successStateTaskProcessor
    importance: critical
    description: DataSet success
dagEdges:
  - from: check
    to: begin
  - from: begin
    to: prepare
  - from: prepare
    to: load
  - from: load
    to: compact
  - from: compact
    to: finally
  - from: load
    to: quality
  - from: quality
    to: finally
