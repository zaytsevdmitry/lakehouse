apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-config-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lakehouse-config-svc
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakehouse-config-svc
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.37
          command: ['sh', '-c', 'until wget -q -O /dev/null {{ .Values.keycloak.issuerUri }}; do echo waiting for keycloak; sleep 3; done']
        - name: wait-for-git-server
          image: {{ .Values.git.image | default "alpine/git:latest" | quote }}
          command: ['sh', '-c', 'until git ls-remote {{ .Values.git.repositoryUrl }} >/dev/null 2>&1; do echo "waiting for git-server"; sleep 3; done']
      containers:
        - name: conf-svc
          image: "{{ index .Values "conf-svc" "image" "repository" }}:{{ index .Values "conf-svc" "image" "tag" }}"
          imagePullPolicy: {{ index .Values "conf-svc" "image" "pullPolicy" }}
          ports:
            - containerPort: 8082
              protocol: TCP
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: {{ .Values.keycloak.issuerUri | quote }}
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              value: {{ .Values.keycloak.internalClientSecret | quote }}
            - name: LAKEHOUSE_CONFIG_GIT_REPOSITORY_URL
              value: {{ .Values.git.repositoryUrl | quote }}
            - name: LAKEHOUSE_CONFIG_GIT_BRANCH
              value: {{ .Values.git.branch | quote }}
            - name: LAKEHOUSE_CONFIG_GIT_LOCAL_CLONE_PATH
              value: {{ .Values.git.localClonePath | quote }}
            - name: LAKEHOUSE_CONFIG_GIT_SYNC_ENABLED
              value: {{ .Values.git.sync.enabled | quote }}
            - name: LAKEHOUSE_CONFIG_GIT_SYNC_INTERVAL_MS
              value: {{ .Values.git.sync.intervalMs | quote }}
            - name: LAKEHOUSE_CONFIG_GIT_SYNC_INITIAL_DELAY_MS
              value: {{ .Values.git.sync.initialDelayMs | quote }}
          command: ["bash", "-c"]
          args:
            - "java 
            -Dserver.port={{ .Values.java.serverPort }}
            -Dspring.datasource.url=jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=ConfigSVC 
            -Dlakehouse.config.schedule.send.kafka.producer.properties.bootstrap.servers=broker:9092 
            -jar /opt/lakehouse-config-svc-{{ .Chart.AppVersion }}-jar-with-dependencies.jar"
