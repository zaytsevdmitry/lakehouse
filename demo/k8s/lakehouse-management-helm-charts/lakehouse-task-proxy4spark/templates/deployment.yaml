apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-task-proxy4spark
spec:
  replicas: {{ .Values.proxy4spark.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lakehouse-task-proxy4spark
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakehouse-task-proxy4spark
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: lakehouse-app-sa
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.37
          command: ['sh', '-c', 'until wget -q -O /dev/null http://keycloak:8085/realms/lakehouse; do echo waiting for keycloak; sleep 3; done']
      containers:
        - name: proxy4spark
          image: "{{ .Values.proxy4spark.image.repository }}:{{ .Values.proxy4spark.image.tag }}"
          imagePullPolicy: {{ .Values.proxy4spark.image.pullPolicy }}
          ports:
            - containerPort: 8090
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://db-dev:5432/postgresDB?ApplicationName=TaskProxy4Spark"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgresUser"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgresPW"
            - name: SPRING_DATASOURCE_DRIVER-CLASS-NAME
              value: "org.postgresql.Driver"
            - name: LAKEHOUSE_TASK_PROXY4SPARK_ADAPTER
              value: {{ .Values.proxy4spark.adapter | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_SPARK-MASTER
              value: {{ .Values.proxy4spark.sparkMaster | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_STANDALONE_REST-URL
              value: {{ .Values.proxy4spark.standalone.restUrl | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_YARN_REST-URL
              value: {{ .Values.proxy4spark.yarn.restUrl | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_K8S_NAMESPACE
              value: {{ .Values.proxy4spark.k8s.namespace | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_K8S_REST-URL
              value: {{ .Values.proxy4spark.k8s.restUrl | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_K8S_SUBMISSION-ID-PATTERN
              value: {{ .Values.proxy4spark.k8s.submissionIdPattern | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_SCHEDULER_POLL-INTERVAL-MS
              value: {{ .Values.proxy4spark.scheduler.pollIntervalMs | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_SCHEDULER_POOL-SIZE
              value: {{ .Values.proxy4spark.scheduler.poolSize | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_METRICS_SUBMISSION-TIMEOUT-SECONDS
              value: {{ .Values.proxy4spark.metrics.submissionTimeoutSeconds | quote }}
            - name: LAKEHOUSE_TASK_PROXY4SPARK_CLEANUP_RETENTION-SECONDS
              value: {{ .Values.proxy4spark.cleanup.retentionSeconds | quote }}
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus,metrics"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_STEP
              value: "1m"
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: "lakehouse-task-proxy4spark"
            - name: KEYCLOAK_ISSUER_URI
              value: {{ .Values.keycloak.issuerUri | quote }}
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              value: {{ .Values.keycloak.internalClientSecret | quote }}
          volumeMounts:
            - name: spark-defaults
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
          command: [ "/opt/java/jdk-23.0.2/bin/java", "-jar", "/opt/lakehouse-task-spark-apps/lakehouse-task-proxy-for-spark-0.10.0-jar-with-dependencies.jar"]
      volumes:
        - name: spark-defaults
          configMap:
            name: spark-defaults-conf
