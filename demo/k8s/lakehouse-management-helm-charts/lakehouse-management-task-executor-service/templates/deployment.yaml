apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-management-task-executor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lakehouse-management-task-executor-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakehouse-management-task-executor-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: lakehouse-app-sa
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.37
          command: ['sh', '-c', 'until wget -q -O /dev/null http://keycloak:8085/realms/lakehouse; do echo waiting for keycloak; sleep 3; done']
      containers:
        - name: task-executor-svc
          image: "lakehouse:0.10.0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              protocol: TCP
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: {{ .Values.keycloak.issuerUri | quote }}
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              value: {{ .Values.keycloak.internalClientSecret | quote }}
            - name: VAULT_TOKEN
              value: {{ .Values.vault.token | quote }}
          command: ["bash", "-c"]
          args:
            - "java
            -Dserver.port=8091
            -Dlakehouse.client.rest.config.server.url=http://lakehouse-management-config-service:8080
            -Dlakehouse.client.rest.scheduler.server.url=http://lakehouse-management-scheduler-service:8081
            -Dlakehouse.client.rest.state.server.url=http://lakehouse-management-state-service:8082
            -Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.group.id=default
            -Dlakehouse.task-executor.service.id=default
            -Dlakehouse.task-executor.scheduled.task.kafka.consumer.concurrency=5
            -Dlakehouse.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers=broker:9092
            -jar /opt/lakehouse-task-executor-svc-0.10.0-jar-with-dependencies.jar"
