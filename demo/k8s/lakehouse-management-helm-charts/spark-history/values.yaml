replicaCount: 1

image:
  repository: lakehouse-spark-aws
  tag: 0.10.0
  pullPolicy: IfNotPresent

# Секреты и окружение выносим в values для гибкости
env:
  awsAccessKeyId: "spark_user"
  awsSecretAccessKey: "spark_pwd"
  s3Endpoint: "http://minio:9000"
  s3TestUrl: "http://minio:9001"
  sparkMode: "history"
  # Scoped OpenBao token for the S3 credentials provider (BaoS3CredentialsProvider):
  # spark-history reads event logs from s3a://sparklogs backed by kv/infrastructure/minio
  vaultToken: "lakehouse-spark-token"

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "500m"
    memory: 1Gi


