dbDev:
  image:
    repository: postgres
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    size: 2Gi
  env:
    POSTGRES_USER: postgresUser
    POSTGRES_PASSWORD: postgresPW
    POSTGRES_DB: postgresDB
broker:
  image:
    repository: apache/kafka
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9092
    targetPort: 9092

spark-operator:
  rbac:
    create: true
    # one space role
    clusterRole: false
  watchNamespaces:
    - "lakehouse-management"
  webhook:
    enable: false

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
minio:
  # 1. Используем тот же образ, что и в Docker Compose
  image:
    registry: quay.io
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent

  auth:
    rootUser: "spark_user"
    rootPassword: "spark_pwd"

  defaultBuckets: "data,sparklogs"

  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001

  persistence:
    enabled: true
    size: 5Gi
    mountPath: /data

  tls:
    enabled: false

  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
    pullPolicy: IfNotPresent
  env:
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://db-dev:5432/postgresDB?currentSchema=keycloak&ApplicationName=Keycloak
    KC_DB_USERNAME: postgresUser
    KC_DB_PASSWORD: postgresPW
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: admin_local_password
    KC_HOSTNAME: keycloak
    KC_HOSTNAME_PORT: "8085"
    KC_HOSTNAME_STRICT: "false"
    KC_HTTP_PORT: "8085"
    KC_HEALTH_ENABLED: "true"
    KC_METRICS_ENABLED: "true"

# ============================================================================
# OpenBao — development/demo secrets engine (KV v2).
#
# The official `bao server -dev` binary is the container PID 1; seeding is done
# once by the `openbao-seed` Job (backoffLimit keeps retrying, the seed script
# is idempotent). Demo default credentials (postgresPW / spark_user /
# spark_pwd) come from the `openbao` ConfigMap seed script and match the demo
# `dbDev` and `minio` sections, so nothing is stored in this file.
#
# Production: there is no seed script — the information security administrator
# provisions the credentials in a Kubernetes Secret, e.g.:
#   kubectl -n lakehouse-management create secret generic openbao \
#     --from-literal=LAKEHOUSE_DB_PASSWORD=... \
#     --from-literal=MINIO_ROOT_USER=... \
#     --from-literal=MINIO_ROOT_PASSWORD=...
# and references it via valueFrom (nothing is stored in this file):
#   seed:
#     enabled: false      # or keep it, if seeding is still required
#     env:
#       - name: LAKEHOUSE_DB_PASSWORD
#         valueFrom:
#           secretKeyRef:
#             name: openbao
#             key: LAKEHOUSE_DB_PASSWORD
#       - name: MINIO_ROOT_USER
#         valueFrom:
#           secretKeyRef:
#             name: openbao
#             key: MINIO_ROOT_USER
#       - name: MINIO_ROOT_PASSWORD
#         valueFrom:
#           secretKeyRef:
#             name: openbao
#             key: MINIO_ROOT_PASSWORD
openbao:
  image:
    repository: quay.io/openbao/openbao
    tag: "2.0"
    pullPolicy: IfNotPresent
  # Optional env passed to the dev-server Deployment (rarely needed; the dev
  # root token id is fixed by the server command line).
  serverEnv: []
  # One-shot seeding Job (KV v2 engine, demo secrets, read-only policy,
  # scoped token). Disable it and rely on external provisioning in production.
  seed:
    enabled: true
    env: []   # optional overrides (see the valueFrom example above)

lakehouse-management-task-executor-service:
  serviceAccount:
    create: false
    name: "lakehouse-app-sa"

lakehouse-task-proxy4spark:
  image:
    repository: lakehouse-task-proxy4spark
    tag: "0.10.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8090
  replicaCount: 1
  adapter: k8s
  sparkMaster: "k8s://https://kubernetes.default.svc"
  k8s:
    namespace: "lakehouse-management"
    restUrl: "https://kubernetes.default.svc"
  scheduler:
    pollIntervalMs: 5000
    poolSize: 2
  metrics:
    submissionTimeoutSeconds: 30

lakehouse-management-ui-svc:
  ui-svc:
    image:
      repository: lakehouse
      tag: "0.10.0"
      pullPolicy: IfNotPresent
    replicaCount: 1
    service:
      type: NodePort
      port: 8084
      targetPort: 8084


