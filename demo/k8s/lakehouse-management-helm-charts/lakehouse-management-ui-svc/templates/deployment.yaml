apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-management-ui-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lakehouse-management-ui-svc
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakehouse-management-ui-svc
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.37
          command: ['sh', '-c', 'until wget -q -O /dev/null http://keycloak:8085/realms/lakehouse; do echo waiting for keycloak; sleep 3; done']
      containers:
        - name: ui-svc
          image: "lakehouse:0.9.0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              protocol: TCP
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: {{ .Values.keycloak.issuerUri | quote }}
            - name: KEYCLOAK_UI_CLIENT_SECRET
              value: {{ .Values.keycloak.uiClientSecret | quote }}
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              value: {{ .Values.keycloak.internalClientSecret | quote }}
          command: ["bash", "-c"]
          args:
            - "java
            -Dlakehouse.ui.health-check-timeout-ms=3000
            -Dlakehouse.ui.services[0].name=lakehouse-config-svc
            -Dlakehouse.ui.services[0].url=http://lakehouse-management-config-service:8080
            -Dlakehouse.ui.services[0].health-check-url=http://lakehouse-management-config-service:8080/healthz
            -Dlakehouse.ui.services[1].name=lakehouse-scheduler-svc
            -Dlakehouse.ui.services[1].url=http://lakehouse-management-scheduler-service:8081
            -Dlakehouse.ui.services[1].health-check-url=http://lakehouse-management-scheduler-service:8081/healthz
            -Dlakehouse.ui.services[2].name=lakehouse-state-svc
            -Dlakehouse.ui.services[2].url=http://lakehouse-management-state-service:8082
            -Dlakehouse.ui.services[2].health-check-url=http://lakehouse-management-state-service:8082/healthz
            -Dlakehouse.ui.services[3].name=lakehouse-task-proxy-for-spark
            -Dlakehouse.ui.services[3].url=http://lakehouse-task-proxy4spark:8090
            -Dlakehouse.ui.services[3].health-check-url=http://lakehouse-task-proxy4spark:8090/healthz
            -Dlakehouse.ui.services[4].name=lakehouse-task-executor-svc
            -Dlakehouse.ui.services[4].url=http://lakehouse-management-task-executor-service:8091
            -Dlakehouse.ui.services[4].health-check-url=http://lakehouse-management-task-executor-service:8091/healthz
            -Dlakehouse.ui.services[5].name=lakehouse-trino
            -Dlakehouse.ui.services[5].url=http://{{ .Release.Name }}-trino:8080
            -Dlakehouse.ui.services[5].health-check-url=http://{{ .Release.Name }}-trino:8080
            -Dlakehouse.ui.services[6].name=lakehouse-spark-history
            -Dlakehouse.ui.services[6].url=http://spark-history:18080
            -Dlakehouse.ui.services[6].health-check-url=http://spark-history:18080
            -Dlakehouse.ui.services[7].name=lakehouse-minio
            -Dlakehouse.ui.services[7].url=http://minio:9001
            -Dlakehouse.ui.services[7].health-check-url=http://minio:9000/minio/health/live
            -Dlakehouse.ui.services[8].name=db-dev
            -Dlakehouse.ui.services[8].url=http://db-dev:5432
            -Dlakehouse.ui.services[8].health-check-url=db-dev:5432
            -Dlakehouse.ui.services[8].check-type=tcp
            -Dlakehouse.ui.services[9].name=kafka-broker
            -Dlakehouse.ui.services[9].url=http://broker:9092
            -Dlakehouse.ui.services[9].health-check-url=broker:9092
            -Dlakehouse.ui.services[9].check-type=tcp
            -Dlakehouse.client.rest.config.server.url=http://lakehouse-management-config-service:8080
            -Dlakehouse.client.rest.state.server.url=http://lakehouse-management-state-service:8082
            -Dlakehouse.client.rest.scheduler.server.url=http://lakehouse-management-scheduler-service:8081
            -Dlakehouse.client.rest.task-proxy-for-spark.server.url=http://lakehouse-task-proxy4spark:8090
            -Dlakehouse.ui.vertices.lakehouse-config-svc=lakehouse-config-svc
            -Dlakehouse.ui.vertices.topic-schedule-conf=kafka-broker
            -Dlakehouse.ui.vertices.topic-tasks=kafka-broker
            -Dlakehouse.ui.vertices.lakehouse-scheduler-svc=lakehouse-scheduler-svc
            -Dlakehouse.ui.vertices.lakehouse-task-executor-svc=lakehouse-task-executor-svc
            -Dlakehouse.ui.vertices.lakehouse-state-svc=lakehouse-state-svc
            -Dlakehouse.ui.vertices.lakehouse-task-proxy-for-spark=lakehouse-task-proxy-for-spark
            -Dlakehouse.ui.vertices.processingdb=db-dev
            -Dlakehouse.ui.vertices.confdb=db-dev
            -Dlakehouse.ui.vertices.schedulerdb=db-dev
            -Dlakehouse.ui.vertices.sparkproxydb=db-dev
            -Dlakehouse.ui.vertices.lakehouse-minio=lakehouse-minio
            -Dlakehouse.ui.vertices.lakehouse-trino=lakehouse-trino
            -Dlakehouse.ui.vertices.lakehouse-spark-history=lakehouse-spark-history
            -Dlakehouse.ui.edges.lakehouse-config-svc[0]=confdb
            -Dlakehouse.ui.edges.lakehouse-config-svc[1]=topic-schedule-conf
            -Dlakehouse.ui.edges.lakehouse-config-svc[2]=lakehouse-scheduler-svc
            -Dlakehouse.ui.edges.topic-schedule-conf[0]=lakehouse-scheduler-svc
            -Dlakehouse.ui.edges.lakehouse-scheduler-svc[0]=topic-tasks
            -Dlakehouse.ui.edges.lakehouse-scheduler-svc[1]=schedulerdb
            -Dlakehouse.ui.edges.topic-tasks[0]=lakehouse-task-executor-svc
            -Dlakehouse.ui.edges.lakehouse-task-executor-svc[0]=lakehouse-state-svc
            -Dlakehouse.ui.edges.lakehouse-task-executor-svc[1]=lakehouse-task-proxy-for-spark
            -Dlakehouse.ui.edges.lakehouse-task-executor-svc[2]=processingdb
            -Dlakehouse.ui.edges.lakehouse-task-executor-svc[3]=lakehouse-scheduler-svc
            -Dlakehouse.ui.edges.lakehouse-task-proxy-for-spark[0]=sparkproxydb
            -Dlakehouse.ui.edges.lakehouse-task-proxy-for-spark[1]=lakehouse-minio
            -Dlakehouse.ui.edges.lakehouse-minio[0]=lakehouse-trino
            -Dlakehouse.ui.edges.lakehouse-minio[1]=lakehouse-spark-history
            -jar /opt/lakehouse-ui-svc-0.9.0-jar-with-dependencies.jar"
