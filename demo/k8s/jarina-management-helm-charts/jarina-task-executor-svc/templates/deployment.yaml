{{- $root := index .Values "jarina-task-executor-service" }}
{{- range $instance := $root.instances }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarina-task-executor-svc-{{ $instance.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jarina-task-executor-svc
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $instance.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jarina-task-executor-svc
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $instance.name }}
    spec:
      serviceAccountName: {{ $root.serviceAccount.name }}
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.37
          command: ['sh', '-c', 'until wget -q -O /dev/null {{ $.Values.keycloak.issuerUri }}; do echo waiting for keycloak; sleep 3; done']
      containers:
        - name: task-executor-svc
          image: "{{ $root.image.repository }}:{{ $root.image.tag }}"
          imagePullPolicy: {{ $root.image.pullPolicy }}
          ports:
            - containerPort: 8090
              protocol: TCP
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: {{ $.Values.keycloak.issuerUri | quote }}
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              value: {{ $.Values.keycloak.internalClientSecret | quote }}
            - name: VAULT_TOKEN
              value: {{ $.Values.vault.token | quote }}
          command: ["bash", "-c"]
          args:
            - "java
            -Dserver.port=8090
            -Djarina.client.rest.config.server.url={{ $root.clients.configUrl }}
            -Djarina.client.rest.scheduler.server.url={{ $root.clients.schedulerUrl }}
            -Djarina.client.rest.state.server.url={{ $root.clients.stateUrl }}
            -Djarina.task-executor.scheduled.task.kafka.consumer.properties.group.id={{ $instance.groupId }}
            -Djarina.task-executor.service.id={{ $instance.serviceId }}
            -Djarina.task-executor.scheduled.task.kafka.consumer.concurrency={{ $instance.concurrency }}
            -Djarina.task-executor.scheduled.task.kafka.consumer.properties.bootstrap.servers={{ $root.kafka.bootstrapServers }}
            -jar /opt/jarina-task-executor-svc-{{ $.Chart.AppVersion }}-jar-with-dependencies.jar"
{{- end }}
