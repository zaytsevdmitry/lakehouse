server:
  port: 8090

spring:
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://lakehouse-auth-svc:8080/realms/lakehouse}
      client:
        registration:
          keycloak-internal:
            provider: keycloak
            client-id: lakehouse-internal-client
            client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:super-secret-internal-key-987654321}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://lakehouse-auth-svc:8080/realms/lakehouse}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_ISSUER_URI:http://lakehouse-auth-svc:8080/realms/lakehouse}/protocol/openid-connect/token
  datasource:
    url: jdbc:postgresql://localhost:5432/postgresDB?ApplicationName=TaskProxy4Spark
    username: postgresUser
    password: postgresPW
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      transaction:
        jta:
          platform: org.hibernate.service.jta.platform.internal.JBossStandAloneJtaPlatform
    properties:
      jakarta:
        persistence:
          create-database-schemas: true
      hibernate:
        default_schema: lakehouse_proxy_spark

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m
    tags:
      application: lakehouse-task-proxy4spark

lakehouse:
  task:
    proxy4spark:
      adapter: local
      spark-master: "local[*]"
      standalone:
        rest-url: "http://localhost:6066"
        submission-id-pattern: '(driver-\d{14}-\d{4})'
      yarn:
        rest-url: "http://localhost:8088"
        submission-id-pattern: 'Submitted application (application_\d+_\d+) to YARN'
      k8s:
        namespace: "default"
        rest-url: "http://kubernetes.default.svc"
        submission-id-pattern: 'submission ID [a-zA-Z0-9-]+:([a-zA-Z0-9\-]+-driver)'
      scheduler:
        poll-interval-ms: 5000
        pool-size: 2
      inspection:
        poll-interval-ms: 10000
        pool-size: 2
        batch-size: 10
      cleanup:
        poll-interval-ms: 60000
        pool-size: 1
        batch-size: 50
        retention-seconds: 3600
      metrics:
        submission-timeout-seconds: 30

  health:
    liveness-path: /healthz
    readiness-path: /readyz
