logging:
  level:
    org:
      springframework:
        transaction:
          interceptor: ERROR
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgresDB?ApplicationName=ConfigSVC
    username: postgresUser
    password: postgresPW
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      transaction:
        jta:
          platform: org.hibernate.service.jta.platform.internal.JBossStandAloneJtaPlatform
    properties:
      jakarta:
        persistence:
          create-database-schemas: true
      hibernate:
        default_schema: yarina_config
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://yarina-auth-svc:8080/realms/yarina}
      client:
        registration:
          keycloak-internal:
            provider: keycloak
            client-id: yarina-internal-client
            client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:super-secret-internal-key-987654321}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://yarina-auth-svc:8080/realms/yarina}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_ISSUER_URI:http://yarina-auth-svc:8080/realms/yarina}/protocol/openid-connect/token

yarina:
  security:
    enabled: true
  config:
    # Global variables of the complex: a flat key-value space served by GET /v1_0/configs/gvars.
    # Declared either here (yarina.config.gvars.<key>: <value>) or through the environment
    # (YARINA_CONFIG_GVARS_<KEY>=<value>); bound once at start-up and cached in memory.
    gvars: {}
    produce:
      delay-ms: 10000
      initial-delay-ms: 20000
      limit: 100
      topic: configuration_changes
      kafka:
        producer:
          properties:
              bootstrap.servers: localhost:9092
    vcs:
      # Synchronization loop settings; independent of the VCS backend, hence its own
      # vcs.sync block rather than a git.sync one.
      sync:
        enabled: ${YARINA_CONFIG_GIT_SYNC_ENABLED:false}
        interval-ms: ${YARINA_CONFIG_GIT_SYNC_INTERVAL_MS:30000}
        initial-delay-ms: ${YARINA_CONFIG_GIT_SYNC_INITIAL_DELAY_MS:10000}

  # Configuration domains (yarina.domains.<name>.git.*). A domain is active iff its
  # repository-url is set; credentials are declared per domain under git.credentials.
  # domains:
  #   platform:
  #     priority: 0
  #     git:
  #       repository-url: ${YARINA_DOMAINS_PLATFORM_GIT_REPOSITORY_URL:}
  #       branch: ${YARINA_DOMAINS_PLATFORM_GIT_BRANCH:main}
  #       local-clone-path: ${YARINA_DOMAINS_PLATFORM_GIT_LOCAL_CLONE_PATH:}
  #       credentials:
  #         auth-type: ssh
  #         ssh-private-key-path: ${YARINA_DOMAINS_PLATFORM_GIT_CREDENTIALS_SSH_PRIVATE_KEY_PATH:}
  #     domains:
  #       processing:
  #         priority: 1
  #         git: { ... }
  domains: {}

  health:

    liveness-path: /healthz
    readiness-path: /readyz

---
# Production profile: completely disable Swagger (api-docs + UI)
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


