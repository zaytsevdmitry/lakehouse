debug: enabled
server:
  port: 8081
logging:
  level:
    org:
      springframework:
        transaction:
          interceptor: ERROR
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgresDB?ApplicationName=SchedulerSVC
    username: postgresUser
    password: postgresPW
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      transaction:
        jta:
          platform: org.hibernate.service.jta.platform.internal.JBossStandAloneJtaPlatform
    properties:
      jakarta:
        persistence:
          create-database-schemas: true
      hibernate:
        default_schema: lakehouse_scheduler
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://lakehouse-auth-svc:8080/realms/lakehouse}
      client:
        registration:
          keycloak-internal:
            provider: keycloak
            client-id: lakehouse-internal-client
            client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:super-secret-internal-key-987654321}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://lakehouse-auth-svc:8080/realms/lakehouse}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_ISSUER_URI:http://lakehouse-auth-svc:8080/realms/lakehouse}/protocol/openid-connect/token
lakehouse:
  security:
    enabled: true
  client:
    rest:
      config:
        server:
          url: http://localhost:8080
  scheduler:
    schedule:
      task:
        kafka:
          producer:
            topic: scheduled_task_msg
            properties:
              bootstrap.servers: localhost:9092
    config:
      schedule:
        kafka:
          consumer:
            properties:
              bootstrap.servers: localhost:9092
              group.id: scheduler
              auto.offset.reset: earliest
            topics: schedule_effective_changes
            concurrency: 1
    registration:
      delay-ms: 6000
      initial-delay-ms: 5000
    run:
      delay-ms: 1200
      initial-delay-ms: 3000
    resolvedeps:
      delay-ms: 1500
      initial-delay-ms: 10000
    task:
      retry:
        delay-ms: 14000
        initial-delay-ms: 10000
        lag-when-failed: 10000
        lag-when-config-failed: 240000

  health:
    liveness-path: /healthz
    readiness-path: /readyz

---
# Production profile: completely disable Swagger (api-docs + UI)
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


